<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blanc cafe</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header class="header">
        <div class="logo"><a href="#">blanc</a></div>
        <nav class="nav">
            <ul>
                <li><a href="#menu-list">menu</a></li>
                <li><a href="#access">access</a></li>
                <li><a href="#about">about</a></li>
                <li><a href="#contact">contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="main-visual">
            <img src="img/TOP.jpg" alt="おすすめメニュー">
        </section>

        <div class="section-divider"></div>

        <section class="menu" id="menu-list">
            <h2>menu   季節のパフェ</h2>

            <div class="menu-list">
                <div class="menu-item">
                    <img src="img/menu1.webp" alt="トロピカルパフェ">
                    <h3>トロピカルパフェ</h3>
                    <p>¥2,700</p>
                </div>

                <div class="menu-item">
                    <img src="img/menu2.jpg" alt="桃パフェ">
                    <h3>桃パフェ</h3>
                    <p>¥2,900</p>
                </div>

                <div class="menu-item">
                    <img src="img/menu3.jpg" alt="マスカットパフェ">
                    <h3>マスカットパフェ</h3>
                    <p>¥3,000</p>
                </div>

                <div class="menu-item">
                    <img src="img/menu4.jpg" alt="モンブランパフェ">
                    <h3>モンブランパフェ</h3>
                    <p>¥2,400</p>
                </div>
            </div>
        </section>

        <div class="section-divider"></div>

        <section class="access" id="access">
            <h2>access</h2>
            <p>〒810-0028<br>福岡市中央区浄水通 3-3 浄水フラッツ101</p>
            <p>営業時間 11:00 - 18:00<br>定休日　水曜日</p>
        </section>

        <div class="section-divider"></div>

        <section class="about" id="about">
            <h2>about</h2>
            <p>blancは、「お好きにどうぞを」テーマに<br>幸せな時間を過ごしていただくことを追求しています。</p>
        </section>


        <div class="section-divider"></div>

        <section class="contact" id="contact">
            <h2>contact</h2>
            <p>お問い合わせはこちらから</p>
            <a href="https://www.instagram.com/blanc_fukuoka_/" class="instagram-button" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                <img src="img/instagram.jpg" alt="Instagram">
            </a>
        </section>
    </main>

    <footer class="footer">
        <p>© blanc cafe</p>
    </footer>
</body>
</html>
