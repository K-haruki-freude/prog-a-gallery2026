<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blanc cafe</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header class="header">
        <div class="logo"><a href="#">blanc</a></div>
        <nav class="nav">
            <ul>
                <li><a href="#menu-list">menu</a></li>
                <li><a href="#access">access</a></li>
                <li><a href="#about">about</a></li>
                <li><a href="#contact">contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="main-visual">
            <img src="img/TOP.jpg" alt="おすすめメニュー">
        </section>

        <div class="section-divider"></div>

        <section class="menu" id="menu-list">
            <h2>menu   季節のパフェ</h2>

            <div class="menu-list">
                <div class="menu-item">
                    <img src="img/menu1.webp" alt="トロピカルパフェ" class="menu-popup-trigger">
                    <h3>トロピカルパフェ</h3>
                    <p>¥2,700</p>
                </div>

                <div class="menu-item">
                    <img src="img/menu2.jpg" alt="桃パフェ" class="menu-popup-trigger">
                    <h3>桃パフェ</h3>
                    <p>¥2,900</p>
                </div>

                <div class="menu-item">
                    <img src="img/menu3.jpg" alt="マスカットパフェ" class="menu-popup-trigger">
                    <h3>マスカットパフェ</h3>
                    <p>¥3,000</p>
                </div>

                <div class="menu-item">
                    <img src="img/menu4.jpg" alt="モンブランパフェ" class="menu-popup-trigger">
                    <h3>モンブランパフェ</h3>
                    <p>¥2,400</p>
                </div>
            </div>
        </section>

        <div class="section-divider"></div>

        <section class="access" id="access">
            <h2>access</h2>
            <p>〒810-0028<br>福岡市中央区浄水通 3-3 浄水フラッツ101</p>
            <p>営業時間 11:00 - 18:00<br>定休日　水曜日</p>
        </section>

        <div class="section-divider"></div>

        <section class="about" id="about">
            <h2>about</h2>
            <p>blancは、「お好きにどうぞを」テーマに<br>幸せな時間を過ごしていただくことを追求しています。</p>
        </section>


        <div class="section-divider"></div>

        <section class="contact" id="contact">
            <h2>contact</h2>
            <p>お問い合わせはこちらから</p>
            <a href="https://www.instagram.com/blanc_fukuoka_/" class="instagram-button" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                <img src="img/instagram.jpg" alt="Instagram">
            </a>
        </section>
    </main>

    <footer class="footer">
        <p>© blanc cafe</p>
    </footer>

    <!-- MENU画像ポップアップ -->
    <div class="menu-modal" id="menuModal" aria-hidden="true">
        <div class="menu-modal-overlay"></div>
        <div class="menu-modal-content" role="dialog" aria-modal="true" aria-label="メニュー画像">
            <button class="menu-modal-close" type="button" aria-label="閉じる">&times;</button>
            <img id="menuModalImage" src="" alt="">
        </div>
    </div>

    <script>
        const menuTriggers = document.querySelectorAll('.menu-popup-trigger');
        const menuModal = document.getElementById('menuModal');
        const menuModalImage = document.getElementById('menuModalImage');
        const menuModalClose = document.querySelector('.menu-modal-close');
        const menuModalOverlay = document.querySelector('.menu-modal-overlay');

        function openMenuModal(image) {
            menuModalImage.src = image.src;
            menuModalImage.alt = image.alt;
            menuModal.classList.add('is-open');
            menuModal.setAttribute('aria-hidden', 'false');
            document.body.classList.add('modal-open');
        }

        function closeMenuModal() {
            menuModal.classList.remove('is-open');
            menuModal.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('modal-open');
        }

        menuTriggers.forEach((image) => {
            image.addEventListener('click', () => openMenuModal(image));
        });

        menuModalClose.addEventListener('click', closeMenuModal);
        menuModalOverlay.addEventListener('click', closeMenuModal);

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && menuModal.classList.contains('is-open')) {
                closeMenuModal();
            }
        });
    </script>

</body>
</html>
